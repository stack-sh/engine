[package]
name = "stack-formatter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical formatter for the Stack diagram language"

[features]
conformance = []

[dependencies]
stack-compiler.workspace = true

[dev-dependencies]
serde_json = "1.0.151"

[[test]]
name = "conformance"
path = "tests/conformance.rs"
required-features = ["conformance"]

[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
