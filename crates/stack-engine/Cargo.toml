[package]
name = "stack-engine"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure execution facade for Stack diagram operations"

publish = ["crates-io"]
homepage = "https://stack-diagram.com/"
documentation = "https://docs.rs/stack-engine"
readme = "README.md"
include = ["src/**", "tests/fixtures/**", "tests/snapshots/**", "README.md", "LICENSE", "THIRD_PARTY_LICENSES.md"]

[features]
conformance = []

[dependencies]
roxmltree.workspace = true
serde_json.workspace = true
sha2.workspace = true
stack-compiler.workspace = true
stack-formatter.workspace = true
stack-theme.workspace = true

[dev-dependencies]
serde.workspace = true

[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
