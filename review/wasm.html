<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stack Engine WASM Review</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 32px; background: Canvas; color: CanvasText; }
      main { max-width: 760px; margin: 0 auto; }
      pre { overflow: auto; padding: 16px; border: 1px solid GrayText; border-radius: 8px; }
      [data-state="passed"] { color: #16803a; }
      [data-state="failed"] { color: #c22; }
    </style>
  </head>
  <body>
    <main>
      <h1>Stack Engine WASM Review</h1>
      <p id="status" data-state="loading">Loading the browser module…</p>
      <pre id="result" aria-live="polite"></pre>
    </main>
    <script type="module">
      import init, { check, format, render } from "../packages/engine/index.js";

      const status = document.querySelector("#status");
      const result = document.querySelector("#result");
      const source = 'stack 1.0 diagram "Browser" { node web "Web" edge web -> api "HTTPS" node api "API" }';

      try {
        await init();
        const formatted = format(source);
        const checked = check(new TextEncoder().encode(source));
        const rendered = render(source);
        if (formatted.diagnostics.length !== 0 || checked.diagnostics.length !== 0 || !rendered.svg) {
          throw new Error("valid browser source did not produce clean operation results");
        }
        status.textContent = "All browser operations passed.";
        status.dataset.state = "passed";
        result.textContent = JSON.stringify({
          formattedSource: formatted.formattedSource,
          diagnosticCount: checked.diagnostics.length,
          svgBytes: new TextEncoder().encode(rendered.svg).byteLength,
          metadata: rendered.metadata,
        }, null, 2);
        document.documentElement.dataset.ready = "true";
      } catch (error) {
        status.textContent = "Browser smoke failed.";
        status.dataset.state = "failed";
        result.textContent = error instanceof Error ? error.stack ?? error.message : String(error);
        document.documentElement.dataset.ready = "failed";
      }
    </script>
  </body>
</html>
