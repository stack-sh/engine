[workspace]
members = ["crates/stack-engine", "crates/stack-engine-wasm", "crates/stack-formatter"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/stack-sh/engine"

[workspace.dependencies]
roxmltree = "=0.21.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
stack-compiler = "=0.1.0"
stack-formatter = { path = "crates/stack-formatter", version = "=0.1.0" }
stack-theme = "=0.5.0"
